name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ReminderDucky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReminderDucky
          path: ReminderDucky.apk

      # The Google Play bundle, signed with the private upload key. Skipped until
      # the UPLOAD_KEYSTORE_B64 and UPLOAD_KEY_PASSWORD secrets are added.
      - name: Build the Google Play bundle
        if: env.UPLOAD_KEYSTORE_B64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.p12" ./gradlew bundleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/bundle/release/app-release.aab ReminderDucky-GooglePlay.aab

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Reminder Ducky 1.0.${{ github.run_number }}
          body: |
            Download **ReminderDucky.apk** below on your Android phone and open it to install or update.
            **ReminderDucky-GooglePlay.aab** (when present) is the file to upload to Google Play Console.
            Built from commit ${{ github.sha }}.
          files: |
            ReminderDucky.apk
            ReminderDucky-GooglePlay.aab
          fail_on_unmatched_files: false
          make_latest: true
