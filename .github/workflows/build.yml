name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ReminderDucky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReminderDucky
          path: ReminderDucky.apk

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Reminder Ducky 1.0.${{ github.run_number }}
          body: |
            Download **ReminderDucky.apk** below on your Android phone and open it to install or update.
            Built from commit ${{ github.sha }}.
          files: ReminderDucky.apk
          make_latest: true
