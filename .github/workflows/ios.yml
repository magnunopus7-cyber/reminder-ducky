name: Build iPhone app

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ios/**'
      - 'app/src/main/assets/duck.frag'
      - 'app/src/main/res/drawable-nodpi/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      # Optional: with these secrets set, builds from main go to TestFlight.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project Ducky.xcodeproj -scheme Ducky -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build-device.log 2>&1 \
            || { grep -E "error:" -A3 build-device.log | head -150; tail -30 build-device.log; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Ducky.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../Ducky-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Ducky-unsigned-ipa
          path: ios/build/Ducky-unsigned.ipa

      - name: Run in the iPhone simulator and take pictures
        run: |
          xcodebuild -project Ducky.xcodeproj -scheme Ducky -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1 \
            || { grep -E "error:" -A3 build-sim.log | head -150; tail -30 build-sim.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x['name'].startswith('iPhone')]
          print(phones[-1]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=build/sim/Build/Products/Debug-iphonesimulator/Ducky.app
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p build/shots
          for LANG_ARG in en ko; do
            EXTRA=""; [ "$LANG_ARG" = ko ] && EXTRA="-ko"
            xcrun simctl terminate "$DEVICE" app.reminderducky || true
            xcrun simctl launch "$DEVICE" app.reminderducky -uiPreview $EXTRA
            sleep 12
            xcrun simctl io "$DEVICE" screenshot "build/shots/app_$LANG_ARG.png"
            DATA=$(xcrun simctl get_app_container "$DEVICE" app.reminderducky data)
            for f in "$DATA"/Documents/widget_*.png; do cp "$f" "build/shots/${LANG_ARG}_$(basename "$f")"; done
          done
          ls -la build/shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-pictures
          path: ios/build/shots
          if-no-files-found: ignore

      # Keeps the pictures on a side branch so they can be looked at without downloading the build.
      - name: Save pictures to the ios-previews branch
        if: github.ref != 'refs/heads/main'
        run: |
          cd build/shots
          git init -q -b ios-previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Simulator pictures from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-previews

      - name: Send to TestFlight
        if: github.ref == 'refs/heads/main' && env.ASC_KEY_ID != ''
        run: |
          echo "$ASC_KEY_P8" > build/AuthKey.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $PWD/build/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project Ducky.xcodeproj -scheme Ducky -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ducky.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive > build-archive.log 2>&1 \
            || { grep -E "error:" -A3 build-archive.log | head -150; tail -30 build-archive.log; exit 1; }
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Ducky.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export $AUTH
