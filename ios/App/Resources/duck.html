<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Draws Ducky with the same shader as the Android app (duck.frag) and gives
// it the same personality: bobbing, blinking, moods and a squish on tap.
// The app inserts the shader source in place of the marker below.
const FRAG = /*FRAG*/"";
const VERT = "attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }";

const YAW_RIGHT = -1.3, YAW_LEFT = -Math.PI + 1.3;
const SQUASH_SECONDS = 0.45;
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: true });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ["uRes", "uRot", "uBob", "uScale", "uMat", "uBody", "uHead", "uBeak", "uAcc",
                 "uAccA", "uAccB", "uEyeMode", "uEyeR", "uDeco", "uDecoAmt", "uDecoSide"]) {
  U[n] = gl.getUniformLocation(prog, n);
}

function rgb(c) { return [((c >> 16) & 255) / 255, ((c >> 8) & 255) / 255, (c & 255) / 255]; }

const state = {
  look: { mat: 0, body: 0xFFD01A, head: 0xFFD01A, beak: 0xFF801F, acc: 0, accA: 0xFFFFFF, accB: 0xFFFFFF },
  mood: "normal",          // resting mood: normal or sleepy
  reaction: null, reactionStart: 0, reactionEnd: 0,
  squashStart: -10, nextBlink: 2, blinkStart: -10,
  facingRight: true,
};
const start = performance.now() / 1000;

// Pose and face for a mood at time t (seconds), mirroring DuckRenderer.kt.
function pose(mood, t, inMood) {
  const yaw = state.facingRight ? YAW_RIGHT : YAW_LEFT;
  const p = { y: yaw + 0.15 * Math.sin(t * 0.7), roll: 0.05 * Math.sin(t * 1.5 + 1), bob: 0.03 * Math.sin(t * 1.5),
              sx: 1, sy: 1, eyeMode: 0, eye: [0.058, 0.085, 0.05], deco: 0, decoAmt: 0 };
  if (mood === "happy") {
    p.eyeMode = 1; p.bob = 0.06 * Math.abs(Math.sin(t * 6)); p.roll = 0.08 * Math.sin(t * 6);
    p.deco = 1; p.decoAmt = 0.6 + 0.4 * Math.sin(t * 4);
  } else if (mood === "excited") {
    p.eye = [0.062, 0.09, 0.055]; p.bob = 0.08 * Math.abs(Math.sin(t * 7)); p.roll = 0.22 * Math.sin(t * 7);
    p.y += 0.2 * Math.sin(t * 3); p.deco = 1; p.decoAmt = 0.6 + 0.4 * Math.sin(t * 5);
  } else if (mood === "sleepy") {
    p.eyeMode = 2; p.bob = 0.02 * Math.sin(t * 0.9); p.roll = -0.12 + 0.03 * Math.sin(t * 0.9);
    p.y = yaw + 0.05 * Math.sin(t * 0.4); p.deco = 2; p.decoAmt = 0.5 + 0.5 * Math.sin(t * 1.4);
  } else if (mood === "surprised") {
    p.eye = [0.072, 0.105, 0.06]; p.bob = 0.12 * Math.max(0, 1 - inMood * 3);
    p.sy = 1.06; p.sx = 0.97; p.deco = 3; p.decoAmt = 1;
  }
  return p;
}

function draw(p, w, h) {
  const cy = Math.cos(p.y), sny = Math.sin(p.y), cr = Math.cos(p.roll), sr = Math.sin(p.roll);
  const rot = [cy * cr, -cy * sr, sny, sr, cr, 0, -sny * cr, sny * sr, cy];
  const l = state.look;
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes, w, h);
  gl.uniformMatrix3fv(U.uRot, false, rot);
  gl.uniform1f(U.uBob, p.bob);
  gl.uniform3f(U.uScale, p.sx, p.sy, p.sx);
  gl.uniform1f(U.uMat, l.mat);
  gl.uniform3fv(U.uBody, rgb(l.body));
  gl.uniform3fv(U.uHead, rgb(l.head));
  gl.uniform3fv(U.uBeak, rgb(l.beak));
  gl.uniform1f(U.uAcc, l.acc);
  gl.uniform3fv(U.uAccA, rgb(l.accA));
  gl.uniform3fv(U.uAccB, rgb(l.accB));
  gl.uniform1f(U.uEyeMode, p.eyeMode);
  gl.uniform3fv(U.uEyeR, p.eye);
  gl.uniform1f(U.uDeco, p.deco);
  gl.uniform1f(U.uDecoAmt, p.decoAmt);
  gl.uniform1f(U.uDecoSide, state.facingRight ? 1 : -1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// The Lock Screen shows widgets in one colour and uses only how see-through each
// pixel is. So Ducky's shading goes into transparency (dark parts more see-through)
// and the picture is cropped tight so Ducky fills the widget.
function lockPicture(size) {
  const px = new Uint8Array(size * size * 4);
  gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let x0 = size, y0 = size, x1 = -1, y1 = -1;
  const lums = [];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = (y * size + x) * 4, a = px[i + 3];
    if (a < 80) continue;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    lums.push((0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / a);
  }
  if (x1 < 0) return canvas.toDataURL("image/png");
  lums.sort((a, b) => a - b);
  const lo = lums[Math.floor(lums.length * 0.03)], hi = lums[Math.floor(lums.length * 0.97)];
  const side = Math.max(x1 - x0, y1 - y0) + 8;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const out = document.createElement("canvas");
  out.width = out.height = side;
  const ctx = out.getContext("2d");
  const img = ctx.createImageData(side, side);
  for (let y = 0; y < side; y++) for (let x = 0; x < side; x++) {
    const sx = Math.round(cx - side / 2 + x), sy = Math.round(cy + side / 2 - y);  // GL rows run bottom-up
    if (sx < 0 || sy < 0 || sx >= size || sy >= size) continue;
    const i = (sy * size + sx) * 4, a = px[i + 3];
    if (a === 0) continue;
    const l = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / a;
    const k = Math.min(1, Math.max(0, (l - lo) / Math.max(0.01, hi - lo)));
    const o = (y * side + x) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = 255;
    img.data[o + 3] = Math.round(a * (0.18 + 0.82 * k * k));
  }
  ctx.putImageData(img, 0, 0);
  return out.toDataURL("image/png");
}

let paused = false;
function frame() {
  requestAnimationFrame(frame);
  if (paused) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const now = performance.now() / 1000, t = now - start;
  const mood = now < state.reactionEnd ? state.reaction : state.mood;
  const p = pose(mood, t, now - state.reactionStart);
  if (t > state.nextBlink) { state.blinkStart = t; state.nextBlink = t + 2.5 + Math.random() * 3; }
  const b = (t - state.blinkStart) / 0.16;
  if (p.eyeMode === 0 && b >= 0 && b <= 1) p.eye = [p.eye[0], p.eye[1] * Math.max(0.12, 1 - Math.sin(b * Math.PI) * 0.95), p.eye[2]];
  const s = now - state.squashStart;
  if (s < SQUASH_SECONDS) {
    const k = Math.sin(s / SQUASH_SECONDS * Math.PI) * 0.16;
    p.sx *= 1 + k * 0.6; p.sy *= 1 - k;
  }
  draw(p, w, h);
}

window.duck = {
  setLook(look) { Object.assign(state.look, look); },
  setMood(mood) { state.mood = mood; },
  react(mood, seconds) {
    const now = performance.now() / 1000;
    state.reaction = mood; state.reactionStart = now; state.reactionEnd = now + seconds;
  },
  squash() { state.squashStart = performance.now() / 1000; },
  /** A still picture of Ducky in a mood, as a PNG data URL (for the widget).
   *  With `lock`, a white picture for the one-colour Lock Screen. */
  snapshot(mood, size, lock) {
    paused = true;
    const w = canvas.width, h = canvas.height;
    canvas.width = size; canvas.height = size;
    const p = pose(mood, 0, 1);
    if (mood === "happy" || mood === "excited") p.decoAmt = 1;
    if (mood === "sleepy") p.decoAmt = 0.9;
    if (lock) p.deco = 0;  // keep Ducky as big as possible on the small Lock Screen widgets
    draw(p, size, size);
    const url = lock ? lockPicture(size) : canvas.toDataURL("image/png");
    canvas.width = w; canvas.height = h;
    paused = false;
    return url;
  },
};
canvas.addEventListener("touchstart", () => {}, { passive: true });
requestAnimationFrame(frame);
</script>
</body>
</html>
